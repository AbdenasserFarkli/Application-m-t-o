
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>

    <div class="container">

        <h1>Weather App</h1>

        <div class="search-section">
            <input type="text" id="city-input" placeholder="Enter city name...">
            <button id="search-btn">Search</button>
        </div>

        <div class="weather-card">

            <h2 id="city-name">Casablanca</h2>
            <p id="date">Monday, November 9</p>

            <div class="temperature">
                <span id="temperature">24</span>
                <span>°C</span>
            </div>

            <p id="description">Sunny</p>

            <div class="weather-details">

                <div class="detail">
                    <h3>Humidity</h3>
                    <p id="humidity">45%</p>
                </div>

                <div class="detail">
                    <h3>Wind Speed</h3>
                    <p id="wind">12 km/h</p>
                </div>

            </div>

        </div>

    </div>
    <button
    id="retry-btn"
    class=" hidden w-20 mt-4 px-6 py-3 bg-black text-center text-white font-semibold rounded-lg hover:bg-blue-700 active:scale-95 transition duration-200 flex items-center gap-2"
>
    <i class="fa-solid fa-rotate-right"></i>
    Retry 🗘
</button>
    <div id="results">
        <div id="loding" class=" hidden flex items-center gap-3">
    <div class="w-5 h-5 border-2 border-gray-300 border-t-blue-500 rounded-full animate-spin "></div>
    <p class="text-gray-600">Chargement des données...</p>
</div>
    
</div>
        <div id="weather-next"     class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 mt-8">
>

            
        </div>
</body>
</html>
